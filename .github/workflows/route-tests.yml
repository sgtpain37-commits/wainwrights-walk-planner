name: Route mapping tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: node scripts/audit-route-locations.cjs > /tmp/route-collisions.json
      - run: diff -u docs/route-location-collisions.json /tmp/route-collisions.json
