name: Refresh route audit for Low Water fix
on:
  push:
    branches:
      - fix/low-water-unverified-guidance-gate
    paths:
      - .github/workflows/refresh-low-water-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate deterministic audit
        run: node scripts/export-route-audit.cjs
      - name: Commit generated audit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/wainwrights-audit.v1.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh summit audit after Low Water safety metadata change"
            git push
          fi
